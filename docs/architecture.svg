<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="1000" fill="#ffffff"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#1F4B5A">Site Diary</text>
  <text x="40" y="70" font-size="15" fill="#3d5c66">What the supervisor does, and how a knock-off defect reaches the widget and the warning.</text>

  <rect x="40" y="96" width="460" height="92" rx="12" fill="#E07A3D"/>
  <text x="60" y="128" font-size="18" font-weight="700" fill="#ffffff">Site supervisor</text>
  <text x="60" y="154" font-size="14" fill="#ffffff">Opens the day. Records a defect. Signs the crew on and off.</text>
  <text x="60" y="174" font-size="14" fill="#ffffff">Closes the day when the crew is off and defects are clear.</text>

  <line x1="270" y1="188" x2="270" y2="214" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,214 276,214 270,224" fill="#1F4B5A"/>

  <rect x="40" y="228" width="460" height="74" rx="12" fill="#1F4B5A"/>
  <text x="60" y="258" font-size="18" font-weight="700" fill="#ffffff">SwiftUI views</text>
  <text x="60" y="282" font-size="14" fill="#d5e4e8">Home, the day on site, defects, crew, close-out</text>

  <line x1="270" y1="302" x2="270" y2="328" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,328 276,328 270,338" fill="#1F4B5A"/>

  <rect x="40" y="342" width="460" height="74" rx="12" fill="#1F4B5A"/>
  <text x="60" y="372" font-size="18" font-weight="700" fill="#ffffff">View models</text>
  <text x="60" y="396" font-size="14" fill="#d5e4e8">Call use cases only. They never see Core Data.</text>

  <line x1="270" y1="416" x2="270" y2="442" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,442 276,442 270,452" fill="#1F4B5A"/>

  <rect x="40" y="456" width="460" height="108" rx="12" fill="#f4f7f6" stroke="#1F4B5A" stroke-width="2"/>
  <text x="60" y="486" font-size="18" font-weight="700" fill="#1F4B5A">Use cases</text>
  <text x="60" y="512" font-size="14" fill="#1F4B5A">OpenTodaysDiary</text>
  <text x="250" y="512" font-size="14" font-weight="700" fill="#C65A1E">TrackDefect</text>
  <text x="60" y="536" font-size="14" fill="#1F4B5A">SignCrew</text>
  <text x="250" y="536" font-size="14" fill="#1F4B5A">CloseOutWorkday</text>

  <line x1="270" y1="564" x2="270" y2="590" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,590 276,590 270,600" fill="#1F4B5A"/>

  <rect x="40" y="604" width="460" height="74" rx="12" fill="#1F4B5A"/>
  <text x="60" y="634" font-size="18" font-weight="700" fill="#ffffff">SiteDiaryRepository</text>
  <text x="60" y="658" font-size="14" fill="#d5e4e8">Protocol. The tests use a mock, not the store.</text>

  <line x1="270" y1="678" x2="270" y2="704" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,704 276,704 270,714" fill="#1F4B5A"/>

  <rect x="40" y="718" width="460" height="92" rx="12" fill="#e7f0f2" stroke="#1F4B5A" stroke-width="2"/>
  <text x="60" y="750" font-size="18" font-weight="700" fill="#1F4B5A">Core Data in the App Group</text>
  <text x="60" y="776" font-size="14" fill="#1F4B5A">Workday, Defect, CrewPresence</text>
  <text x="60" y="796" font-size="14" fill="#1F4B5A">SiteDiary.sqlite in group.com.iosdev.SiteDiary</text>

  <line x1="270" y1="810" x2="270" y2="836" stroke="#1F4B5A" stroke-width="2"/>
  <polygon points="264,836 276,836 270,846" fill="#1F4B5A"/>
  <text x="284" y="834" font-size="13" fill="#3d5c66">after the save</text>

  <rect x="40" y="850" width="460" height="86" rx="12" fill="#1F4B5A"/>
  <text x="60" y="884" font-size="18" font-weight="700" fill="#ffffff">SiteDiaryGlance.json</text>
  <text x="60" y="910" font-size="14" fill="#d5e4e8">The only copy the extensions are allowed to read.</text>

  <rect x="540" y="228" width="250" height="110" rx="12" fill="#ffffff" stroke="#1F4B5A" stroke-width="2"/>
  <text x="558" y="260" font-size="16" font-weight="700" fill="#1F4B5A">Widget</text>
  <text x="558" y="286" font-size="13" fill="#1F4B5A">Reads the glance.</text>
  <text x="558" y="306" font-size="13" fill="#1F4B5A">Does not open Core Data.</text>

  <rect x="540" y="456" width="250" height="120" rx="12" fill="#ffffff" stroke="#C65A1E" stroke-width="2"/>
  <text x="558" y="488" font-size="16" font-weight="700" fill="#C65A1E">Knock-off warning</text>
  <text x="558" y="514" font-size="13" fill="#1F4B5A">The app schedules it</text>
  <text x="558" y="534" font-size="13" fill="#1F4B5A">for knock-off time,</text>
  <text x="558" y="554" font-size="13" fill="#1F4B5A">from the same save.</text>

  <rect x="540" y="700" width="250" height="130" rx="12" fill="#ffffff" stroke="#1F4B5A" stroke-width="2"/>
  <text x="558" y="732" font-size="16" font-weight="700" fill="#1F4B5A">Notification view</text>
  <text x="558" y="758" font-size="13" fill="#1F4B5A">When the warning is</text>
  <text x="558" y="778" font-size="13" fill="#1F4B5A">opened, this reads</text>
  <text x="558" y="798" font-size="13" fill="#1F4B5A">the glance, not the store.</text>

  <path d="M500 893 H520 V283 H540" fill="none" stroke="#1F4B5A" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="540,277 540,289 550,283" fill="#1F4B5A"/>

  <path d="M500 641 H522 V516 H540" fill="none" stroke="#C65A1E" stroke-width="2"/>
  <polygon points="530,510 530,522 540,516" fill="#C65A1E"/>
  <text x="528" y="630" font-size="12" fill="#C65A1E">schedules</text>

  <path d="M500 893 H520 V765 H540" fill="none" stroke="#1F4B5A" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="540,759 540,771 550,765" fill="#1F4B5A"/>

  <text x="548" y="960" font-size="13" fill="#3d5c66">Dashed arrows are read-only.</text>
  <text x="548" y="980" font-size="13" fill="#3d5c66">The orange arrow schedules the warning.</text>
</svg>
